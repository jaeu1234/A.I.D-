<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>선생님 위치 예측</title>
  <link rel="stylesheet" href="./src/styles/predict.css" />
</head>
<body>
  <header>
    <button class="menu-btn" id="menuBtn" aria-label="목록 열기">☰</button>
    <h1>🔮 선생님 위치 예측</h1>
    <nav class="topnav">
      <a href="index.html">학생</a>
      <a href="admin.html">관리자</a>
      <a href="upload.html">업로드</a>
      <a href="predict.html" class="active">예측</a>
    </nav>
    <span class="predict-badge" id="predictBadge">예측 모드</span>
  </header>

  <div class="layout">
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- 좌측: 요일·시간 선택 + 선생님 목록 -->
    <aside class="sidebar" id="sidebar">
      <div class="predict-picker">
        <div class="picker-lbl">요일</div>
        <div class="day-picker" id="dayPicker"></div>
        <div class="picker-lbl">시각</div>
        <div class="time-picker">
          <select id="predictHour"></select>
          <span class="colon">:</span>
          <select id="predictMin"></select>
        </div>
        <div class="predict-summary" id="predictSummary"></div>
      </div>
      <div class="search-box">
        <input type="text" id="search" placeholder="선생님 이름 · 과목 검색" autocomplete="off" />
      </div>
      <div class="teacher-list" id="teacherList"></div>
    </aside>

    <!-- 중앙: 지도 -->
    <div class="map-area">
      <div class="floor-tabs" id="floorTabs"></div>
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="map"></canvas>
        <div class="zoom-ctrl">
          <button id="zoomIn" aria-label="확대">＋</button>
          <button id="zoomOut" aria-label="축소">－</button>
          <button id="zoomReset" title="전체 보기" aria-label="전체 보기">⤢</button>
        </div>
      </div>
    </div>

    <!-- 우측(모바일: 하단 시트) 정보 패널 -->
    <aside class="info-panel" id="infoPanel">
      <div class="ip-handle"></div>
      <button class="ip-close" id="ipClose" aria-label="닫기">✕</button>
      <div class="info-panel-body" id="infoPanelBody">
        <div class="info-empty">요일·시각을 고르고<br>선생님을 선택하면<br>그 시점의 예상 위치가 표시됩니다.</div>
      </div>
    </aside>
  </div>

  <script type="module" src="./src/pages/predict.js"></script>
</body>
</html>
