<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>선생님 위치 예측</title>
  <style>
    :root {
      --bg: #f4f5f8;
      --panel: #ffffff;
      --line: #e3e6ef;
      --text: #24272f;
      --muted: #8a90a0;
      --accent: #3b5bdb;
      --accent-soft: #eef2ff;
      --shadow-sm: 0 1px 2px rgba(16, 24, 40, .06);
      --shadow-md: 0 6px 16px rgba(16, 24, 40, .09);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

    /* ── 헤더 ───────────────────────── */
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 22px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      box-shadow: var(--shadow-sm);
      position: relative;
      z-index: 5;
      flex-shrink: 0;
    }
    header h1 { font-size: 17px; font-weight: 800; letter-spacing: -.01em; white-space: nowrap; }
    .topnav { display: flex; gap: 2px; background: #f2f3f8; padding: 3px; border-radius: 10px; }
    .topnav a {
      padding: 6px 13px; font-size: 13px; font-weight: 600; color: var(--muted); text-decoration: none; border-radius: 7px;
      transition: background .15s ease, color .15s ease;
    }
    .topnav a.active { background: var(--accent); color: #fff; box-shadow: var(--shadow-sm); }
    .topnav a:hover:not(.active) { background: #e7e9f3; color: var(--text); }
    header .predict-badge {
      margin-left: auto;
      font-size: 12px; font-weight: 700; color: #8a5a00;
      background: #fff3d6; padding: 5px 12px; border-radius: 20px; white-space: nowrap;
      border: 1px solid #ffe1a1;
    }

    /* ── 본문 레이아웃 ───────────────── */
    .layout { flex: 1; display: flex; min-height: 0; }

    /* 좌측: 예측 조건 + 선생님 목록 */
    .sidebar {
      width: 250px; flex-shrink: 0;
      background: var(--panel);
      border-right: 1px solid var(--line);
      display: flex; flex-direction: column;
    }
    .predict-picker { padding: 14px 14px 10px; border-bottom: 1px solid var(--line); }
    .predict-picker .picker-lbl { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
    .day-picker { display: flex; gap: 4px; margin-bottom: 8px; }
    .day-picker button {
      flex: 1; padding: 7px 0; font-size: 12.5px; font-weight: 700; color: var(--muted);
      background: #f2f3f8; border: none; border-radius: 8px; cursor: pointer;
      transition: background .15s ease, color .15s ease;
    }
    .day-picker button.active { background: var(--accent); color: #fff; box-shadow: var(--shadow-sm); }
    .day-picker button:hover:not(.active) { background: #e7e9f3; color: var(--text); }
    .time-picker { display: flex; align-items: center; gap: 6px; }
    .time-picker select {
      flex: 1; padding: 9px 6px; font-size: 14px; text-align: center;
      border: 1px solid var(--line); border-radius: 9px; outline: none;
      background: #fafbfe; color: var(--text); font-variant-numeric: tabular-nums;
      appearance: none; -webkit-appearance: none; cursor: pointer;
    }
    .time-picker select:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px rgba(59,91,219,.12); }
    .time-picker .colon { font-weight: 700; color: var(--muted); }
    .predict-summary { margin-top: 8px; font-size: 11.5px; color: var(--muted); line-height: 1.5; }

    .search-box { padding: 10px 14px 14px; border-bottom: 1px solid var(--line); }
    .search-box input {
      width: 100%; padding: 10px 12px; font-size: 14px;
      border: 1px solid var(--line); border-radius: 9px; outline: none;
      background: #fafbfe;
      transition: border-color .15s ease, background .15s ease, box-shadow .15s ease;
    }
    .search-box input:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px rgba(59,91,219,.12); }
    .teacher-list { overflow-y: auto; flex: 1; scrollbar-width: thin; scrollbar-color: #d6d9e4 transparent; }
    .teacher-list::-webkit-scrollbar { width: 6px; }
    .teacher-list::-webkit-scrollbar-thumb { background: #d6d9e4; border-radius: 10px; }
    .teacher-list::-webkit-scrollbar-thumb:hover { background: #c2c6d6; }
    .teacher-item {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 14px; cursor: pointer; border-bottom: 1px solid #f2f3f7;
      border-left: 3px solid transparent;
      transition: background .12s ease, border-color .12s ease;
    }
    .teacher-item:hover { background: #f7f8fc; }
    .teacher-item.active { background: var(--accent-soft); border-left-color: var(--accent); }
    .teacher-dot { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
      color: #fff; font-size: 10.5px; font-weight: 700; letter-spacing: -.3px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 1px 3px rgba(0,0,0,.15); }
    .teacher-meta { min-width: 0; }
    .teacher-meta .name { font-size: 14px; font-weight: 600; }
    .teacher-meta .sub { font-size: 11px; color: var(--muted); margin-top: 1px; }

    /* 중앙 지도 */
    .map-area { flex: 1; position: relative; display: flex; flex-direction: column; min-width: 0; }
    .floor-tabs {
      display: flex; gap: 4px; padding: 10px 14px;
      background: var(--panel); border-bottom: 1px solid var(--line); flex-shrink: 0;
    }
    .floor-tabs button {
      padding: 7px 14px; font-size: 13px; font-weight: 600;
      border: 1px solid transparent; background: transparent; border-radius: 8px; cursor: pointer; color: var(--muted);
      transition: background .15s ease, color .15s ease, box-shadow .15s ease;
    }
    .floor-tabs button:hover:not(.active) { background: #f0f2f8; color: var(--text); }
    .floor-tabs button.active { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: var(--shadow-sm); }
    .canvas-wrap { flex: 1; position: relative; overflow: hidden; background: #eceef4; }
    #map { display: block; touch-action: none; }
    .zoom-ctrl { position: absolute; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
    .zoom-ctrl button {
      width: 38px; height: 38px; font-size: 18px; font-weight: 700;
      background: #fff; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; color: var(--text);
      box-shadow: var(--shadow-md);
      transition: background .15s ease, transform .1s ease;
    }
    .zoom-ctrl button:hover { background: #f7f8fc; }
    .zoom-ctrl button:active { transform: scale(.93); }

    /* 우측 정보 패널 */
    .info-panel {
      width: 310px; flex-shrink: 0;
      background: var(--panel); border-left: 1px solid var(--line);
      display: flex; flex-direction: column; overflow-y: auto;
    }
    .info-empty { padding: 48px 24px; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .info-head { padding: 20px 20px 15px; border-bottom: 1px solid var(--line); animation: fadeIn .2s ease; }
    .info-head .name { font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
    .info-head .subject { font-size: 13px; color: var(--muted); margin-top: 3px; }
    .now-card {
      margin: 14px 18px; padding: 15px; border-radius: 14px;
      background: linear-gradient(155deg, #fff8e8, #fffaf0); border: 1px solid #ffe4b0;
      animation: fadeIn .25s ease;
    }
    .now-card .lbl { font-size: 11px; font-weight: 700; color: #a06600; letter-spacing: .05em; text-transform: uppercase; }
    .now-card .loc { font-size: 19px; font-weight: 800; margin-top: 5px; letter-spacing: -.01em; }
    .now-card .next { font-size: 13px; color: #555; margin-top: 9px; }
    .now-card .note { font-size: 12px; color: #c0501a; margin-top: 7px; font-weight: 600; }
    .timeline { padding: 4px 18px 24px; animation: fadeIn .3s ease; }
    .timeline h3 { font-size: 12px; font-weight: 700; color: var(--muted); margin: 14px 0 8px; text-transform: uppercase; letter-spacing: .04em; }
    .tl-row {
      display: flex; align-items: center; gap: 10px; padding: 8px 0;
      border-bottom: 1px solid #f2f3f7; font-size: 13px;
    }
    .tl-time { width: 48px; flex-shrink: 0; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .tl-period { width: 42px; flex-shrink: 0; font-weight: 600; }
    .tl-loc { flex: 1; }
    .tl-row.picked { background: #fff3d6; margin: 0 -8px; padding: 8px 8px; border-radius: 8px; font-weight: 600; box-shadow: inset 0 0 0 1px #ffe1a1; }
    .status-pill { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; margin-left: 6px; background: #ffe58f; color: #7a5a00; }

    /* ── 모바일 전용 컨트롤 ── */
    .menu-btn, .sidebar-backdrop, .ip-handle, .ip-close { display: none; }
    .menu-btn {
      width: 34px; height: 34px; flex-shrink: 0; border: none; border-radius: 9px;
      background: #f2f3f8; color: var(--text); font-size: 17px; cursor: pointer;
    }
    .menu-btn:active { background: #e7e9f3; }

    @media (max-width: 860px) {
      header { gap: 10px; padding: 10px 14px; flex-wrap: wrap; }
      header h1 { font-size: 15px; }
      header .predict-badge { margin-left: 0; }
      .menu-btn { display: inline-flex; align-items: center; justify-content: center; }

      .sidebar {
        position: fixed; top: 0; left: 0; bottom: 0; z-index: 60;
        width: 82vw; max-width: 300px;
        transform: translateX(-100%);
        transition: transform .25s ease;
        box-shadow: var(--shadow-md);
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-backdrop {
        display: block; position: fixed; inset: 0; z-index: 55;
        background: rgba(16,24,40,.35); opacity: 0; pointer-events: none;
        transition: opacity .2s ease;
      }
      .sidebar-backdrop.show { opacity: 1; pointer-events: auto; }

      .floor-tabs { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
      .floor-tabs::-webkit-scrollbar { display: none; }
      .floor-tabs button { flex-shrink: 0; }

      .info-panel {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
        width: 100%; max-width: none; max-height: 62vh;
        border-left: none; border-top: 1px solid var(--line);
        border-radius: 16px 16px 0 0;
        box-shadow: 0 -8px 24px rgba(16,24,40,.16);
        transform: translateY(100%);
        transition: transform .25s ease;
      }
      .info-panel.open { transform: translateY(0); }
      .ip-handle {
        display: block; width: 38px; height: 4px; border-radius: 3px;
        background: var(--line); margin: 10px auto 0; flex-shrink: 0;
      }
      .ip-close {
        display: flex; position: absolute; top: 8px; right: 10px; z-index: 1;
        width: 30px; height: 30px; align-items: center; justify-content: center;
        border: none; border-radius: 50%; background: #f2f3f8; color: var(--muted);
        font-size: 15px; cursor: pointer;
      }
      .info-panel-body { overflow-y: auto; position: relative; }
      .info-panel .info-head { padding-top: 22px; }
      .info-empty { padding: 30px 24px; }
    }
  </style>
</head>
<body>
  <header>
    <button class="menu-btn" id="menuBtn" aria-label="목록 열기">☰</button>
    <h1>🔮 선생님 위치 예측</h1>
    <nav class="topnav">
      <a href="index.html">학생</a>
      <a href="admin.html">관리자</a>
      <a href="upload.html">업로드</a>
      <a href="predict.html" class="active">예측</a>
    </nav>
    <span class="predict-badge" id="predictBadge">예측 모드</span>
  </header>

  <div class="layout">
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- 좌측: 요일·시간 선택 + 선생님 목록 -->
    <aside class="sidebar" id="sidebar">
      <div class="predict-picker">
        <div class="picker-lbl">요일</div>
        <div class="day-picker" id="dayPicker"></div>
        <div class="picker-lbl">시각</div>
        <div class="time-picker">
          <select id="predictHour"></select>
          <span class="colon">:</span>
          <select id="predictMin"></select>
        </div>
        <div class="predict-summary" id="predictSummary"></div>
      </div>
      <div class="search-box">
        <input type="text" id="search" placeholder="선생님 이름 · 과목 검색" autocomplete="off" />
      </div>
      <div class="teacher-list" id="teacherList"></div>
    </aside>

    <!-- 중앙: 지도 -->
    <div class="map-area">
      <div class="floor-tabs" id="floorTabs"></div>
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="map"></canvas>
        <div class="zoom-ctrl">
          <button id="zoomIn" aria-label="확대">＋</button>
          <button id="zoomOut" aria-label="축소">－</button>
          <button id="zoomReset" title="전체 보기" aria-label="전체 보기">⤢</button>
        </div>
      </div>
    </div>

    <!-- 우측(모바일: 하단 시트) 정보 패널 -->
    <aside class="info-panel" id="infoPanel">
      <div class="ip-handle"></div>
      <button class="ip-close" id="ipClose" aria-label="닫기">✕</button>
      <div class="info-panel-body" id="infoPanelBody">
        <div class="info-empty">요일·시각을 고르고<br>선생님을 선택하면<br>그 시점의 예상 위치가 표시됩니다.</div>
      </div>
    </aside>
  </div>

  <script type="module">
    import { PERIODS, DAYS, TEACHERS } from './src/data/schedule.js';
    import { FLOORS } from './src/data/floors.js';
    import { getCurrentPeriodIndex, getTodayIndex } from './src/lib/time.js';
    import { getTeacherLocation, resolveRoom, initSync } from './src/lib/location.js';
    import {
      initCanvas, render, resetZoom, setFloorAndReset,
      zoom, pan, zoomToRoom, hitTestPin, setSelectedId,
      setPredictionContext,
    } from './src/lib/map.js';
    import { escapeHtml } from './src/lib/html.js';

    // ── 상태 ──────────────────────────
    let selectedId = null;
    let currentFloor = 1;
    let predictDay = getTodayIndex();      // 0=월 ~ 4=금
    const _now = new Date();
    let predictHour = _now.getHours();     // 0~23 (24시간제 — 오전/오후 없음)
    let predictMin  = Math.floor(_now.getMinutes() / 10) * 10; // 10분 단위로 반올림

    const $ = (id) => document.getElementById(id);
    const canvas = $('map');

    // ── 초기화 ────────────────────────
    function rerenderCurrentSelection() {
      applyPredictionContext();
      render();
      if (selectedId) renderInfo();
    }

    async function boot() {
      await initSync(rerenderCurrentSelection);
      initCanvas(canvas);
      buildDayPicker();
      buildTimePicker();
      buildFloorTabs();
      buildTeacherList();
      applyPredictionContext();
      switchFloor(1);
      updateSummary();
    }
    boot();
    window.addEventListener('resize', () => resetZoom());

    // ── 예측 시점 계산 ─────────────────
    /** "HH:MM" 입력값 → PERIODS 기준 교시 인덱스 (0~7 | -1 쉬는시간/등교전/하교후) */
    function timeToPeriodIndex(hh, mm) {
      const fake = new Date(2000, 0, 1, hh, mm);
      return getCurrentPeriodIndex(fake);
    }

    function currentPredictPeriodIndex() {
      return timeToPeriodIndex(predictHour, predictMin);
    }

    function applyPredictionContext() {
      setPredictionContext(predictDay, currentPredictPeriodIndex());
    }

    function updateSummary() {
      const pi = currentPredictPeriodIndex();
      const periodLabel = pi >= 0 ? PERIODS[pi].label : '쉬는 시간';
      $('predictSummary').textContent = `${DAYS[predictDay]}요일 ${fmtTime()} · ${periodLabel} 기준`;
    }

    function fmtTime() {
      return `${String(predictHour).padStart(2, '0')}:${String(predictMin).padStart(2, '0')}`;
    }

    function onPredictChange() {
      applyPredictionContext();
      updateSummary();
      render();
      if (selectedId) moveToSelected();
      buildTeacherList($('search').value);
    }

    // ── 요일 선택 ─────────────────────
    function buildDayPicker() {
      const wrap = $('dayPicker');
      DAYS.forEach((d, i) => {
        const b = document.createElement('button');
        b.textContent = d;
        b.dataset.day = i;
        b.className = i === predictDay ? 'active' : '';
        b.onclick = () => {
          predictDay = i;
          [...wrap.children].forEach(c => c.classList.toggle('active', Number(c.dataset.day) === i));
          onPredictChange();
        };
        wrap.appendChild(b);
      });
    }

    // ── 시각 선택 (24시간제 드롭다운 — 오전/오후 없음, 항상 같은 순서) ──
    function buildTimePicker() {
      const hourSel = $('predictHour');
      for (let h = 0; h < 24; h++) {
        const opt = document.createElement('option');
        opt.value = h;
        opt.textContent = String(h).padStart(2, '0') + '시';
        hourSel.appendChild(opt);
      }
      hourSel.value = predictHour;

      const minSel = $('predictMin');
      for (let m = 0; m < 60; m += 10) {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = String(m).padStart(2, '0') + '분';
        minSel.appendChild(opt);
      }
      minSel.value = predictMin;

      hourSel.addEventListener('change', e => { predictHour = Number(e.target.value); onPredictChange(); });
      minSel.addEventListener('change',  e => { predictMin  = Number(e.target.value); onPredictChange(); });
    }

    // ── 층 탭 ─────────────────────────
    function buildFloorTabs() {
      const tabs = $('floorTabs');
      [5, 4, 3, 2, 1, 0].forEach(f => {
        const b = document.createElement('button');
        b.textContent = FLOORS[f].label;
        b.dataset.floor = f;
        b.onclick = () => switchFloor(f);
        tabs.appendChild(b);
      });
    }

    function switchFloor(f) {
      currentFloor = f;
      setFloorAndReset(f);
      [...$('floorTabs').children].forEach(b =>
        b.classList.toggle('active', Number(b.dataset.floor) === f));
    }

    // ── 모바일: 좌측 목록 드로어 ───────
    function openSidebar()  { $('sidebar').classList.add('open'); $('sidebarBackdrop').classList.add('show'); }
    function closeSidebar() { $('sidebar').classList.remove('open'); $('sidebarBackdrop').classList.remove('show'); }
    $('menuBtn').onclick = () => {
      $('sidebar').classList.contains('open') ? closeSidebar() : openSidebar();
    };
    $('sidebarBackdrop').onclick = closeSidebar;

    // ── 모바일: 하단 정보 시트 ─────────
    function openInfoSheet()  { $('infoPanel').classList.add('open'); }
    function closeInfoSheet() { $('infoPanel').classList.remove('open'); }
    $('ipClose').onclick = closeInfoSheet;

    $('search').addEventListener('input', e => buildTeacherList(e.target.value));

    // ── 선생님 목록 ───────────────────
    function buildTeacherList(filter = '') {
      const list = $('teacherList');
      list.innerHTML = '';
      const q = filter.trim().toLowerCase();
      TEACHERS
        .filter(t => !q || t.name.toLowerCase().includes(q) || t.subject.toLowerCase().includes(q))
        .forEach(t => {
          const div = document.createElement('div');
          div.className = 'teacher-item' + (t.id === selectedId ? ' active' : '');
          div.onclick = () => selectTeacher(t.id);
          div.innerHTML = `
            <div class="teacher-dot" style="background:${t.color}">${t.id}</div>
            <div class="teacher-meta">
              <div class="name">${t.name}</div>
              <div class="sub">${t.subject}</div>
            </div>`;
          list.appendChild(div);
        });
    }

    // ── 선생님 선택 ───────────────────
    function selectTeacher(id) {
      closeSidebar();
      selectedId = id;
      setSelectedId(id);
      buildTeacherList($('search').value);
      moveToSelected();
      renderInfo();
      openInfoSheet();
    }

    function moveToSelected() {
      if (!selectedId) return;
      const loc = getTeacherLocation(selectedId, predictDay, currentPredictPeriodIndex());
      const targetFloor = loc.floor ?? currentFloor;
      if (FLOORS[targetFloor]) switchFloor(targetFloor);
      const room = resolveRoom(loc.room, loc.floor, currentFloor, FLOORS[currentFloor]);
      if (room) zoomToRoom(room);
      else render();
    }

    // ── 정보 패널 렌더 ────────────────
    function renderInfo() {
      const panel = $('infoPanelBody');
      const t = TEACHERS.find(x => x.id === selectedId);
      if (!t) {
        panel.innerHTML = '<div class="info-empty">요일·시각을 고르고<br>선생님을 선택하면<br>그 시점의 예상 위치가 표시됩니다.</div>';
        return;
      }

      const pi  = currentPredictPeriodIndex();
      const loc = getTeacherLocation(t.id, predictDay, pi);
      const noteHtml = loc.note ? `<div class="note">📌 ${escapeHtml(loc.note)}</div>` : '';

      const rows = PERIODS.map((period, p) => {
        const rowLoc = getTeacherLocation(t.id, predictDay, p);
        const pill = p === pi ? '<span class="status-pill">예측 시점</span>' : '';
        return `
          <div class="tl-row ${p === pi ? 'picked' : ''}">
            <span class="tl-time">${period.start}</span>
            <span class="tl-period">${period.label}</span>
            <span class="tl-loc">${escapeHtml(rowLoc.label)}${pill}</span>
          </div>`;
      }).join('');

      panel.innerHTML = `
        <div class="info-head">
          <div class="name">${escapeHtml(t.name)} <span style="font-size:14px;color:${t.color}">●</span></div>
          <div class="subject">${escapeHtml(t.subject)} 선생님</div>
        </div>
        <div class="now-card">
          <div class="lbl">${DAYS[predictDay]}요일 ${fmtTime()} 예상 위치</div>
          <div class="loc">${escapeHtml(loc.label)}</div>
          ${noteHtml}
        </div>
        <div class="timeline">
          <h3>${DAYS[predictDay]}요일 시간표</h3>
          ${rows}
        </div>
        <div class="class-note" style="padding:0 18px 18px;font-size:11px;color:var(--muted);line-height:1.5;">
          기본 시간표·AI 시간표 기준 예측입니다. 오늘 등록된 임시일정은 오늘 날짜·교시가 일치할 때만 반영됩니다.
        </div>`;
    }

    // ── 캔버스 인터랙션 (index.html과 동일) ──
    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
      zoom(factor, e.clientX - rect.left, e.clientY - rect.top);
    }, { passive: false });

    let dragging = false, moved = false, lastX = 0, lastY = 0;
    const activePointers = new Map();
    let pinchState = null;

    canvas.addEventListener('pointerdown', e => {
      canvas.setPointerCapture(e.pointerId);
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (activePointers.size === 2) {
        dragging = false;
        const [p1, p2] = [...activePointers.values()];
        pinchState = {
          prevDist: Math.hypot(p2.x - p1.x, p2.y - p1.y),
          prevMidX: (p1.x + p2.x) / 2,
          prevMidY: (p1.y + p2.y) / 2,
        };
      } else if (activePointers.size === 1) {
        dragging = true; moved = false; lastX = e.clientX; lastY = e.clientY;
      }
    });
    canvas.addEventListener('pointermove', e => {
      if (!activePointers.has(e.pointerId)) return;
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (activePointers.size >= 2) {
        const [p1, p2] = [...activePointers.values()];
        const rect = canvas.getBoundingClientRect();
        const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        const midX = (p1.x + p2.x) / 2, midY = (p1.y + p2.y) / 2;
        if (pinchState) {
          const dx = midX - pinchState.prevMidX, dy = midY - pinchState.prevMidY;
          if (dx || dy) pan(dx, dy);
          const factor = dist / pinchState.prevDist;
          if (Number.isFinite(factor) && factor > 0) zoom(factor, midX - rect.left, midY - rect.top);
        }
        pinchState = { prevDist: dist, prevMidX: midX, prevMidY: midY };
        return;
      }

      if (!dragging) return;
      const dx = e.clientX - lastX, dy = e.clientY - lastY;
      if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
      pan(dx, dy);
      lastX = e.clientX; lastY = e.clientY;
    });

    function endPointer(e) {
      activePointers.delete(e.pointerId);
      if (activePointers.size < 2) pinchState = null;
      if (activePointers.size === 1) {
        const p = [...activePointers.values()][0];
        dragging = true; moved = true; lastX = p.x; lastY = p.y;
      } else if (activePointers.size === 0) {
        dragging = false;
        if (!moved) {
          const rect = canvas.getBoundingClientRect();
          const id = hitTestPin(e.clientX - rect.left, e.clientY - rect.top);
          if (id) selectTeacher(id);
        }
      }
    }
    canvas.addEventListener('pointerup', endPointer);
    canvas.addEventListener('pointercancel', endPointer);

    $('zoomIn').onclick  = () => zoom(1.3);
    $('zoomOut').onclick = () => zoom(1 / 1.3);
    $('zoomReset').onclick = () => resetZoom();
  </script>
</body>
</html>
