<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>선생님 위치 안내</title>
  <link rel="stylesheet" href="./src/styles/index.css" />
</head>
<body>
  <header>
    <button class="menu-btn" id="menuBtn" aria-label="목록 열기">☰</button>
    <h1>📍 선생님 위치 안내</h1>
    <nav class="topnav">
      <a href="index.html" class="active">학생</a>
      <a href="admin.html">관리자</a>
      <a href="upload.html">업로드</a>
      <a href="predict.html">예측</a>
    </nav>
    <span class="period-badge" id="periodBadge">—</span>
    <span class="clock" id="clock">--:--</span>
  </header>

  <div class="layout">
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- 좌측: 선생님/반 목록 -->
    <aside class="sidebar" id="sidebar">
      <div class="mode-tabs">
        <button class="active" id="modeTeacherBtn">선생님</button>
        <button id="modeClassBtn">반</button>
      </div>
      <div class="search-box">
        <input type="text" id="search" placeholder="선생님 이름 · 과목 검색" autocomplete="off" />
      </div>
      <div class="teacher-list" id="teacherList"></div>
    </aside>

    <!-- 중앙: 지도 -->
    <div class="map-area">
      <div class="floor-tabs" id="floorTabs"></div>
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="map"></canvas>
        <div class="zoom-ctrl">
          <button id="zoomIn" aria-label="확대">＋</button>
          <button id="zoomOut" aria-label="축소">－</button>
          <button id="zoomReset" title="전체 보기" aria-label="전체 보기">⤢</button>
        </div>
      </div>
    </div>

    <!-- 우측(모바일: 하단 시트) 정보 패널 -->
    <aside class="info-panel" id="infoPanel">
      <div class="ip-handle"></div>
      <button class="ip-close" id="ipClose" aria-label="닫기">✕</button>
      <div class="info-panel-body" id="infoPanelBody">
        <div class="info-empty">선생님을 선택하면<br>현재 위치와 시간표가 표시됩니다.</div>
      </div>
    </aside>
  </div>

  <script type="module" src="./src/pages/index.js"></script>
</body>
</html>
