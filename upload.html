<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>시간표 업로드 · AI 분석</title>
  <link rel="stylesheet" href="./src/styles/upload.css" />
</head>
<body>
  <!-- PIN 게이트 -->
  <div class="gate" id="gate">
    <h2>🔒 관리자 인증</h2>
    <p>시간표 업로드는 PIN이 필요합니다.</p>
    <input type="password" id="pin" inputmode="numeric" placeholder="••••" maxlength="8" autocomplete="off" />
    <button id="pinBtn">입장</button>
    <div class="err" id="pinErr"></div>
  </div>

  <div id="app" class="hidden">
  <nav>
    <a href="index.html">📍 학생 화면</a>
    <a href="admin.html">🔒 관리자</a>
    <a href="upload.html" class="active">📷 시간표 업로드</a>
    <a href="predict.html">🔮 위치 예측</a>
  </nav>

  <div class="wrap">
    <h1>시간표 사진 AI 분석</h1>
    <div class="sub">시간표 사진을 올리면 Claude가 읽어 표로 변환합니다. 확인·수정 후 저장하세요.</div>

    <!-- 1. 대상 선택 + 사진 -->
    <div class="card">
      <h3><span class="step">1</span>대상 선택 · 사진 업로드</h3>
      <div style="display:flex;gap:6px;margin-bottom:14px;">
        <button class="btn btn-ghost" id="modeTeacherBtn" style="flex:1;padding:8px 0;font-size:13px;font-weight:700;background:var(--accent);color:#fff;">선생님 시간표</button>
        <button class="btn btn-ghost" id="modeClassBtn" style="flex:1;padding:8px 0;font-size:13px;font-weight:700;">반 시간표</button>
      </div>

      <!-- 선생님 모드 -->
      <div id="teacherRow" class="row">
        <label class="f" style="flex:1; min-width:180px;">선생님
          <select id="teacher"></select>
        </label>
        <label class="f" style="flex:2; min-width:200px;">시간표 사진
          <input type="file" id="file" accept="image/*" />
        </label>
      </div>

      <!-- 반 모드 -->
      <div id="classRow" class="row hidden">
        <label class="f" style="min-width:90px;">학년
          <select id="grade">
            <option value="1">1학년</option>
            <option value="2">2학년</option>
            <option value="3">3학년</option>
          </select>
        </label>
        <label class="f" style="min-width:90px;">반
          <select id="classNum"></select>
        </label>
        <label class="f" style="flex:2; min-width:200px;">시간표 사진
          <input type="file" id="fileClass" accept="image/*" />
        </label>
      </div>

      <img id="preview" class="preview" alt="미리보기" />
      <div class="row" style="margin-top:14px;">
        <button class="btn" id="analyze" disabled>🔍 AI 분석 시작</button>
      </div>
      <div class="status" id="status"></div>
    </div>

    <!-- 3. 결과 편집 -->
    <div class="card hidden" id="resultCard">
      <h3><span class="step">2</span>결과 확인 · 수정</h3>
      <div class="hint" id="editHint">셀 형식: <b>과목(학년-반)</b> 예: 수학(2-1). 빈 시간은 비워두세요. 점심 열은 보통 빈칸입니다.</div>
      <div style="overflow-x:auto;">
        <table class="edit" id="editTable"></table>
      </div>
      <div class="row" style="margin-top:16px;">
        <button class="btn" id="save">💾 이 선생님 시간표로 저장</button>
      </div>
      <div class="status" id="saveStatus"></div>
    </div>
  </div>
  </div>

  <script type="module" src="./src/pages/upload.js"></script>
</body>
</html>
