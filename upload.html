<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>시간표 업로드 · AI 분석</title>
  <style>
    :root { --bg:#f4f5f8; --panel:#fff; --line:#e3e6ef; --text:#24272f; --muted:#8a90a0; --accent:#3b5bdb; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
      background:var(--bg); color:var(--text); }

    nav { display:flex; gap:4px; padding:10px 20px; background:var(--panel); border-bottom:1px solid var(--line); }
    nav a { padding:6px 14px; font-size:14px; font-weight:600; color:var(--muted); text-decoration:none; border-radius:7px; }
    nav a.active { background:var(--accent); color:#fff; }
    nav a:hover:not(.active) { background:#f0f2f8; }

    .wrap { max-width:900px; margin:0 auto; padding:24px 20px 60px; }
    h1 { font-size:22px; margin-bottom:4px; }
    .sub { color:var(--muted); font-size:13px; margin-bottom:20px; }

    .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:20px; }
    .card h3 { font-size:15px; margin-bottom:14px; }
    .card h3 .step { display:inline-block; width:22px; height:22px; line-height:22px; text-align:center;
      background:var(--accent); color:#fff; border-radius:50%; font-size:12px; margin-right:8px; }

    label.f { display:flex; flex-direction:column; gap:5px; font-size:12px; color:var(--muted); font-weight:600; margin-bottom:12px; }
    label.f select, label.f input { padding:9px 10px; font-size:14px; color:var(--text);
      border:1px solid var(--line); border-radius:8px; outline:none; background:#fff; }
    label.f select:focus, label.f input:focus { border-color:var(--accent); }

    .row { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
    .btn { padding:10px 20px; font-size:14px; font-weight:600; background:var(--accent); color:#fff;
      border:none; border-radius:9px; cursor:pointer; }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    .btn-ghost { background:#eef1f8; color:var(--text); }

    .warn { font-size:12px; color:#b8860b; background:#fff8e1; border:1px solid #f0e0a0;
      border-radius:8px; padding:8px 12px; margin-top:10px; }
    .status { font-size:13px; margin-top:10px; min-height:18px; }
    .status.err { color:#c0392b; }
    .status.ok { color:#2d7a4f; }

    .preview { max-width:100%; max-height:280px; border-radius:10px; border:1px solid var(--line); margin-top:12px; display:none; }

    table.edit { width:100%; border-collapse:collapse; font-size:12px; }
    table.edit th, table.edit td { border:1px solid var(--line); padding:2px; text-align:center; }
    table.edit th { background:#f7f8fc; color:var(--muted); font-weight:600; padding:6px 4px; }
    table.edit input { width:100%; min-width:56px; border:none; text-align:center; font-size:12px; padding:5px 2px; outline:none; background:transparent; }
    table.edit input:focus { background:#eef2ff; }
    .hidden { display:none; }
    .hint { color:var(--muted); font-size:12px; margin-bottom:10px; }

    /* PIN 게이트 */
    .gate { max-width:340px; margin:80px auto; background:var(--panel); border:1px solid var(--line);
      border-radius:14px; padding:32px 28px; text-align:center; }
    .gate h2 { font-size:18px; margin-bottom:6px; }
    .gate p { color:var(--muted); font-size:13px; margin-bottom:18px; }
    .gate input { width:100%; padding:11px; font-size:18px; text-align:center; letter-spacing:6px;
      border:1px solid var(--line); border-radius:9px; outline:none; }
    .gate input:focus { border-color:var(--accent); }
    .gate button { width:100%; margin-top:14px; padding:11px; font-size:15px; font-weight:600;
      background:var(--accent); color:#fff; border:none; border-radius:9px; cursor:pointer; }
    .gate .err { color:#c0392b; font-size:13px; margin-top:10px; min-height:18px; }
  </style>
</head>
<body>
  <!-- PIN 게이트 -->
  <div class="gate" id="gate">
    <h2>🔒 관리자 인증</h2>
    <p>시간표 업로드는 PIN이 필요합니다.</p>
    <input type="password" id="pin" inputmode="numeric" placeholder="••••" maxlength="8" autocomplete="off" />
    <button id="pinBtn">입장</button>
    <div class="err" id="pinErr"></div>
  </div>

  <div id="app" class="hidden">
  <nav>
    <a href="index.html">📍 학생 화면</a>
    <a href="admin.html">🔒 관리자</a>
    <a href="upload.html" class="active">📷 시간표 업로드</a>
  </nav>

  <div class="wrap">
    <h1>시간표 사진 AI 분석</h1>
    <div class="sub">시간표 사진을 올리면 Claude가 읽어 표로 변환합니다. 확인·수정 후 저장하세요.</div>

    <!-- 1. 대상 선택 + 사진 -->
    <div class="card">
      <h3><span class="step">1</span>대상 선택 · 사진 업로드</h3>
      <div style="display:flex;gap:6px;margin-bottom:14px;">
        <button class="btn btn-ghost" id="modeTeacherBtn" style="flex:1;padding:8px 0;font-size:13px;font-weight:700;background:var(--accent);color:#fff;">선생님 시간표</button>
        <button class="btn btn-ghost" id="modeClassBtn" style="flex:1;padding:8px 0;font-size:13px;font-weight:700;">반 시간표</button>
      </div>

      <!-- 선생님 모드 -->
      <div id="teacherRow" class="row">
        <label class="f" style="flex:1; min-width:180px;">선생님
          <select id="teacher"></select>
        </label>
        <label class="f" style="flex:2; min-width:200px;">시간표 사진
          <input type="file" id="file" accept="image/*" />
        </label>
      </div>

      <!-- 반 모드 -->
      <div id="classRow" class="row hidden">
        <label class="f" style="min-width:90px;">학년
          <select id="grade">
            <option value="1">1학년</option>
            <option value="2">2학년</option>
            <option value="3">3학년</option>
          </select>
        </label>
        <label class="f" style="min-width:90px;">반
          <select id="classNum"></select>
        </label>
        <label class="f" style="flex:2; min-width:200px;">시간표 사진
          <input type="file" id="fileClass" accept="image/*" />
        </label>
      </div>

      <img id="preview" class="preview" alt="미리보기" />
      <div class="row" style="margin-top:14px;">
        <button class="btn" id="analyze" disabled>🔍 AI 분석 시작</button>
      </div>
      <div class="status" id="status"></div>
    </div>

    <!-- 3. 결과 편집 -->
    <div class="card hidden" id="resultCard">
      <h3><span class="step">2</span>결과 확인 · 수정</h3>
      <div class="hint" id="editHint">셀 형식: <b>과목(학년-반)</b> 예: 수학(2-1). 빈 시간은 비워두세요. 점심 열은 보통 빈칸입니다.</div>
      <div style="overflow-x:auto;">
        <table class="edit" id="editTable"></table>
      </div>
      <div class="row" style="margin-top:16px;">
        <button class="btn" id="save">💾 이 선생님 시간표로 저장</button>
      </div>
      <div class="status" id="saveStatus"></div>
    </div>
  </div>
  </div>

  <script type="module">
    import { TEACHERS, PERIODS, DAYS } from './src/data/schedule.js';
    import { getAllClassrooms } from './src/data/floors.js';
    import { saveAiSchedule, saveClassAiSchedule } from './src/lib/location.js';

    const $ = (id) => document.getElementById(id);

    let imageB64 = null, imageMime = null, parsed = null;
    let currentMode = 'teacher'; // 'teacher' | 'class'

    // 게이트를 통과한 PIN. 실제 저장 권한은 이 값 자체가 아니라 매 저장 요청마다
    // /api/admin-write가 서버에서 다시 검증하는 데서 나온다.
    let adminPin = null;

    // ── PIN 게이트 ──────────────────
    async function tryPin() {
      const candidate = $('pin').value;
      $('pinBtn').disabled = true;
      try {
        const res = await fetch('/api/verify-pin', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ pin: candidate }),
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          adminPin = candidate;
          $('gate').classList.add('hidden');
          $('app').classList.remove('hidden');
        } else {
          $('pinErr').textContent = data.error || 'PIN이 올바르지 않습니다.';
          $('pin').value = '';
        }
      } catch (err) {
        $('pinErr').textContent = `확인 실패: ${err.message}`;
      } finally {
        $('pinBtn').disabled = false;
      }
    }
    $('pinBtn').onclick = tryPin;
    $('pin').addEventListener('keydown', e => { if (e.key === 'Enter') tryPin(); });

    // ── 선생님 select ──────────────
    $('teacher').innerHTML = TEACHERS
      .map(t => `<option value="${t.id}">${t.name} (${t.subject})</option>`).join('');

    // ── 반 select 초기화 ───────────
    function updateClassNums() {
      const grade = Number($('grade').value);
      const classes = getAllClassrooms().filter(c => c.grade === grade);
      $('classNum').innerHTML = classes
        .map(c => `<option value="${c.classNum}">${c.classNum}반</option>`).join('');
    }
    updateClassNums();
    $('grade').addEventListener('change', updateClassNums);

    // ── 모드 전환 ──────────────────
    $('modeTeacherBtn').onclick = () => switchMode('teacher');
    $('modeClassBtn').onclick   = () => switchMode('class');

    function switchMode(mode) {
      currentMode = mode;
      imageB64 = null;
      $('preview').style.display = 'none';
      $('analyze').disabled = true;
      $('resultCard').classList.add('hidden');
      setStatus('status', '', '');

      const isTeacher = mode === 'teacher';
      $('modeTeacherBtn').style.cssText = isTeacher
        ? 'flex:1;padding:8px 0;font-size:13px;font-weight:700;background:var(--accent);color:#fff;'
        : 'flex:1;padding:8px 0;font-size:13px;font-weight:700;';
      $('modeClassBtn').style.cssText = !isTeacher
        ? 'flex:1;padding:8px 0;font-size:13px;font-weight:700;background:var(--accent);color:#fff;'
        : 'flex:1;padding:8px 0;font-size:13px;font-weight:700;';

      $('teacherRow').classList.toggle('hidden', !isTeacher);
      $('classRow').classList.toggle('hidden', isTeacher);

      $('editHint').innerHTML = isTeacher
        ? '셀 형식: <b>과목(학년-반)</b> 예: 수학(2-1). 빈 시간은 비워두세요. 점심 열은 보통 빈칸입니다.'
        : '셀 형식: <b>과목(선생님이름)</b> 예: 수학(홍민지). 선생님 이름이 정확해야 지도에 연동됩니다. 빈 시간은 비워두세요.';
      $('save').textContent = isTeacher ? '💾 이 선생님 시간표로 저장' : '💾 이 반 시간표로 저장';
    }

    // ── 파일 → base64 공통 처리 (업로드 전 축소·압축) ────
    // 휴대폰 카메라 원본(수 MB)을 그대로 base64로 보내면 서버리스 함수의
    // 기본 요청 바디 크기 제한에 걸려 큰 사진이 업로드 실패할 수 있다.
    // AI가 표를 읽는 데는 원본 해상도가 필요 없으므로 canvas로 한 변
    // MAX_DIM 이하로 줄이고 JPEG로 재압축해서 보낸다.
    const MAX_DIM = 1600;
    const JPEG_QUALITY = 0.85;

    function resizeImageFile(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(url);
          let { width, height } = img;
          if (width > MAX_DIM || height > MAX_DIM) {
            const scale = MAX_DIM / Math.max(width, height);
            width = Math.round(width * scale);
            height = Math.round(height * scale);
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', JPEG_QUALITY));
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('이미지를 읽을 수 없습니다.')); };
        img.src = url;
      });
    }

    function bindFileInput(inputId) {
      $(inputId).addEventListener('change', async e => {
        const f = e.target.files[0];
        if (!f) return;
        try {
          const dataUrl = await resizeImageFile(f);
          imageMime = 'image/jpeg';
          imageB64 = dataUrl.split(',')[1];
          $('preview').src = dataUrl;
          $('preview').style.display = 'block';
          $('analyze').disabled = false;
        } catch (err) {
          setStatus('status', 'err', `이미지 처리 실패: ${err.message}`);
        }
      });
    }
    bindFileInput('file');
    bindFileInput('fileClass');

    // ── AI 분석 ────────────────────
    // 실제 Anthropic API 호출은 서버(/api/analyze)가 대신 한다 — API 키가
    // 브라우저에 전혀 노출되지 않도록 서버 환경변수(ANTHROPIC_API_KEY)로만 보관.
    $('analyze').onclick = analyze;

    async function analyze() {
      if (!imageB64) { setStatus('status', 'err', '사진을 먼저 업로드하세요.'); return; }

      $('analyze').disabled = true;
      setStatus('status', '', '분석 중… (수 초 소요)');

      const payload = { mode: currentMode, imageB64, imageMime };
      if (currentMode === 'class') {
        payload.grade = $('grade').value;
        payload.classNum = $('classNum').value;
      }

      try {
        const res = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok) {
          setStatus('status', 'err', `분석 실패: ${data?.error || 'HTTP ' + res.status}`);
          $('analyze').disabled = false; return;
        }

        parsed = normalize(data.schedule);
        renderEditTable(parsed);
        $('resultCard').classList.remove('hidden');
        setStatus('status', 'ok', '분석 완료. 아래에서 확인·수정하세요.');
        $('analyze').disabled = false;
      } catch (err) {
        setStatus('status', 'err', `네트워크 오류: ${err.message}`);
        $('analyze').disabled = false;
      }
    }

    // schedule을 5×8로 정규화
    function normalize(sched) {
      const out = [];
      for (let d = 0; d < 5; d++) {
        const row = Array.isArray(sched?.[d]) ? sched[d] : [];
        const fixed = [];
        for (let p = 0; p < PERIODS.length; p++) {
          const v = row[p];
          fixed.push(typeof v === 'string' && v.trim() ? v.trim() : null);
        }
        out.push(fixed);
      }
      return out;
    }

    // ── 편집 표 렌더 ───────────────
    function renderEditTable(sched) {
      const table = $('editTable');
      let head = '<tr><th>요일</th>' + PERIODS.map(p => `<th>${p.label}</th>`).join('') + '</tr>';
      let rows = DAYS.map((day, d) => {
        const cells = PERIODS.map((_, p) => {
          const v = sched[d][p] ?? '';
          return `<td><input data-d="${d}" data-p="${p}" value="${v.replace(/"/g, '&quot;')}" /></td>`;
        }).join('');
        return `<tr><th>${day}</th>${cells}</tr>`;
      }).join('');
      table.innerHTML = head + rows;
    }

    function collectTable() {
      const out = Array.from({ length: 5 }, () => Array(PERIODS.length).fill(null));
      $('editTable').querySelectorAll('input').forEach(inp => {
        const d = Number(inp.dataset.d), p = Number(inp.dataset.p);
        const v = inp.value.trim();
        out[d][p] = v || null;
      });
      return out;
    }

    // ── 저장 ───────────────────────
    $('save').onclick = async () => {
      const schedule = collectTable();
      $('save').disabled = true;
      try {
        if (currentMode === 'teacher') {
          const id = $('teacher').value;
          await saveAiSchedule(id, schedule, adminPin);
          const t = TEACHERS.find(x => x.id === id);
          setStatus('saveStatus', 'ok', `${t ? t.name : id} 선생님 시간표를 저장했습니다. 학생 화면에 반영됩니다.`);
        } else {
          const grade = $('grade').value, classNum = $('classNum').value;
          const classId = `${grade}-${classNum}`;
          await saveClassAiSchedule(classId, schedule, adminPin);
          setStatus('saveStatus', 'ok', `${grade}학년 ${classNum}반 시간표를 저장했습니다. 반 시간표 화면에 반영됩니다.`);
        }
      } catch {
        setStatus('saveStatus', 'err', '저장에 실패했습니다. Supabase에 class_ai_schedules 테이블이 있는지 확인하세요.');
      } finally {
        $('save').disabled = false;
      }
    };

    // ── 유틸 ───────────────────────
    function setStatus(id, cls, msg) {
      const el = $(id);
      el.className = 'status' + (cls ? ' ' + cls : '');
      el.textContent = msg;
    }
  </script>
</body>
</html>
